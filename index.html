<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>
    <link rel="stylesheet" href="style.css">
</head>
    <body>
      <main class="catalog">
        <div class="container catalog__container">
            <h1 class="title catalog__title">Выбери свой продукт</h1>
            <button class="change-color-button button">Изменить цвет карточки</button>
            <button class="change-colors-button button">Изменить цвет всех карточек</button>
            <button class="open-google-button button">Открыть Google</button>
            <button class="output-console-log-button button">Вывести сообщение в консоль</button>
            <button class="click-me button">Нажми меня!</button>
          <ul id = "productcards-List" class="products clear-list"></ul>
          <template id = productcardsInfo-template>
            <li class="products__card card">
              <img src="" alt="" class="card__image">
              <span class="card__category"></span>
              <h2 class="card__name"></h2>
              <p class="card__description"></p>
              <div class="card__compound compound">
              <span class="compound__name">Состав:</span>
              <ul class="compound__list"></ul>
              </div>
              <div class="card__price">
                <b>Цена</b>
                <span class="card__price-value">3 500 &#x20bd</span>
                </div>
            </li>
          </template>

        </div>
          
      </main>
      <script src="main.js"></script>
      <script src="homework-7.js"></script>
      <script src="homework-8.js"></script>
      <script type ="module" src="homework-10.js"></script>
      <script type ="module" src="homework-9.js"></script>
      <script type ="module" src="comments.js"></script>
    </body>
</html>
